---
ansible_user: "root"
client_name: "router"

host_ip: "xxx.xxx.xxx.xxx"

network: "10.x.x.1/24"
port_awg: "35456"

# Имя AWG-интерфейса на сервере
awg_server_iface: "awg0"

# Значение PersistentKeepalive, которое ставим всем пирам
awg_server_keepalive: 25

# Путь к конфигу AWG (для справки)
awg_server_conf_path: "/etc/amnezia/amneziawg/{{ awg_server_iface }}.conf"